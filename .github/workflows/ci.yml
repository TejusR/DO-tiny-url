name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tiny_url
          POSTGRES_USER: tiny_url
          POSTGRES_PASSWORD: tiny_url
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tiny_url -d tiny_url"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tiny_url:tiny_url@localhost:5432/tiny_url
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.12.13"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run database migrations
        run: uv run alembic upgrade head

      - name: Check model and migration consistency
        run: uv run alembic check

      - name: Test
        run: uv run pytest

  deploy:
    name: Deploy to DigitalOcean
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Deploy application
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN || secrets.DIGITALOCEAN_TOKEN }}
