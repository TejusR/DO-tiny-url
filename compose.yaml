services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tiny_url
      POSTGRES_USER: tiny_url
      POSTGRES_PASSWORD: tiny_url
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiny_url -d tiny_url"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
